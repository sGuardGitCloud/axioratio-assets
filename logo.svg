<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     version="1.2"
     baseProfile="tiny-ps"
     width="1254"
     height="1254"
     viewBox="0 0 1254 1254">

  <title>AxioRatio</title>

  <!-- Background -->
  <rect x="0" y="0"
        width="1254" height="1254"
