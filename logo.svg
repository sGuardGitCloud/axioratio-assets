  <!-- Golden Ratio Emblem -->
  <g fill="#d3c3a8">

    <!-- Outer rectangular frame -->
    <path fill-rule="evenodd" d="
      M218 366 H1028 V815 H218 Z
      M240 388 V793 H1006 V388 Z"/>

    <!-- Main spiral curve -->
    <path d="
      M240 700
      C330 520 475 408 625 382
      L730 382
      C510 412 326 570 264 800
      L240 800 Z"/>

    <!-- Central divider -->
    <rect x="729" y="377" width="15" height="423"/>

    <!-- Upper right section -->
    <path d="
      M744 382
      C880 382 976 482 1006 628
      H744 Z"/>

    <!-- Horizontal divider -->
    <rect x="736" y="628" width="281" height="12"/>

    <!-- Right lower divider -->
    <rect x="862" y="628" width="12" height="172"/>

    <!-- Small square divider -->
    <rect x="736" y="700" width="130" height="12"/>

    <!-- Small upper arc -->
    <path d="
      M744 700
      A59 59 0 0 1 862 700
      Z"/>

    <!-- Lower circular section -->
    <path d="
      M744 713
      H862 V800 H744 Z
      M744 713
      A118 118 0 0 0 862 800
      H862 V713 Z"/>

    <!-- Bottom right section -->
    <path d="
      M874 793
